[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transitlens-gtfs"
version = "0.1.0"
description = "TransitLens TTC GTFS ingestion pipeline for PostgreSQL/PostGIS"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "SQLAlchemy==2.0.45",
    "psycopg[binary]==3.3.2",
    "requests==2.32.5",
    "python-dotenv==1.2.1",
    "GeoAlchemy2==0.18.1",
    "openpyxl==3.1.5",
    "fastapi==0.125.0",
    "uvicorn[standard]==0.38.0",
    "asyncpg==0.31.0",
    "pydantic-settings==2.12.0",
    "redis==7.1.0",
    "aiohttp==3.13.2",
    "scikit-learn==1.8.0",
    "joblib==1.5.2",
    "httpx==0.28.1",
    "pytest==9.0.2",
    "networkx==3.6.1",
]

[project.scripts]
transitlens-gtfs = "transitlens_gtfs.cli:main"
transitlens-api = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["transitlens_gtfs*", "app*"]
