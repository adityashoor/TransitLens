[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/src/**", "/public/**", "/index.html", "/package.json", "/package-lock.json", "/vite.config.ts", "/tsconfig.json", "/Dockerfile", "/nginx.conf"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

